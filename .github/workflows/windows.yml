name: Windows build and release checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check repository hygiene
        run: ./scripts/check-repository-hygiene.ps1
      - name: Restore
        run: dotnet restore -p:Platform=x64
      - name: Build
        run: dotnet build -c Release -p:Platform=x64 --no-restore
      - name: Test
        run: dotnet test -c Release -p:Platform=x64 --no-build --logger trx
      - name: Test browser extension
        run: node --test extension/test/worker.test.js
      - name: Publish and package
        run: ./scripts/publish.ps1
      - name: Check package hygiene
        run: ./scripts/check-repository-hygiene.ps1 -Package artifacts/WhereFrom-0.2.0-win-x64.zip
      - name: Verify the packaged executable
        run: |
          Expand-Archive -LiteralPath artifacts/WhereFrom-0.2.0-win-x64.zip -DestinationPath artifacts/verify
          ./scripts/smoke-test.ps1 -Executable ./artifacts/verify/WhereFrom-win-x64/wherefrom.exe
          ./scripts/smoke-test-gui.ps1 -Executable ./artifacts/verify/WhereFrom-win-x64/GUI/WhereFrom.App.exe -FilePath ./README.zh-CN.md
          ./scripts/smoke-test-native-host.ps1 -Executable ./artifacts/verify/WhereFrom-win-x64/NativeHost/WhereFrom.NativeHost.exe -ExtensionId (./scripts/get-extension-id.ps1)
      - name: Prepare installer compiler
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $signature = Get-AuthenticodeSignature $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') { throw 'Compiler signature mismatch.' }
          $target = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $download -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', ('/DIR="' + $target + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler setup failed.' }
      - name: Build installer
        run: ./scripts/build-installer.ps1 -Compiler "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"
      - name: Test installer with isolated PATH registry keys
        run: ./scripts/test-installer.ps1 -Compiler "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"
      - name: Test upgrade from v0.1.1
        run: ./scripts/test-upgrade-installer.ps1 -Compiler "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: WhereFrom-win-x64
          path: |
            artifacts/WhereFrom-0.2.0-win-x64.zip
            artifacts/WhereFrom-0.2.0-win-x64-Setup.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
